# Broker OAuth do vsx — https://developers.cloudflare.com/workers/
#
# Deploy:  cd broker && npx wrangler login && npx wrangler deploy
# (o endereço impresso, tipo https://vsx-broker.conta.workers.dev, é o que
#  você cola em js/broker.js — DEFAULT_BROKER_URL)

name = "vsx-broker"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Client ID do OAuth App do vsx (https://github.com/settings/developers).
# Authorization callback URL: https://x3x31.github.io/vsx/
VSX_CLIENT_ID = ""

# Origens autorizadas a usar o broker, separadas por vírgula.
# Use "*.github.io" para aceitar qualquer fork publicado no Pages.
VSX_ALLOWED_ORIGINS = "https://x3x31.github.io"

# Segredo do OAuth App: só é preciso se a troca responder
# "incorrect_client_credentials". Nunca chega ao navegador.
#   npx wrangler secret put VSX_CLIENT_SECRET
