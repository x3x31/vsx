name: EduTerminal APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EduTerminal/android-app/**"
      - "EduTerminal/bootstrap/**"
      - "EduTerminal/installer/**"
      - ".github/workflows/eduterminal-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eduterminal.jks"
            echo "EDUTERMINAL_KEYSTORE=$RUNNER_TEMP/eduterminal.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          EDUTERMINAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EDUTERMINAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EDUTERMINAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$EDUTERMINAL_KEYSTORE" ]; then
            gradle -p EduTerminal/android-app assembleRelease
          else
            gradle -p EduTerminal/android-app assembleDebug
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: eduterminal-apk
          path: |
            EduTerminal/android-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
