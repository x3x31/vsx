version: "3.9"
services:
  vsx-bridge:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "4173:4173"
    environment:
      - HOST=0.0.0.0
      - BRIDGE_SECRET=${BRIDGE_SECRET:-vsx-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://x3x31.github.io}
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: ["bash", "-c", "npm install --no-audit --no-fund 2>/dev/null || true && npm run start:codespace"]
    restart: unless-stopped
