<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduTerminal</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #171a23;
        --line: #2a2f3d;
        --text: #e6e8ef;
        --muted: #9aa3b5;
        --accent: #6ea8fe;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
      header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 22px; }
      h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
      .sub { color: var(--muted); font-size: 13px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .code {
        font: 700 40px/1.1 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.16em;
        color: var(--accent);
        margin: 12px 0 4px;
      }
      .muted { color: var(--muted); font-size: 13px; }
      .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.ok { background: var(--ok); }
      .dot.err { background: var(--err); }
      button {
        background: #232838;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
      button.danger { color: var(--err); }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 11px 0; border-top: 1px solid var(--line);
      }
      li:first-child { border-top: 0; }
      .name { font-weight: 600; }
      .actions { display: flex; gap: 8px; }
      .empty { color: var(--muted); font-size: 14px; }
      code { background: #0b0e15; border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
      .error { color: var(--err); font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>EduTerminal</h1>
        <span class="sub">servidor local do VSX</span>
        <button class="primary" id="open-vsx" style="margin-left:auto" onclick="location.href='/vsx/'">Abrir VSX</button>
      </header>

      <section class="card">
        <div class="row">
          <span class="status"><span class="dot" id="health-dot"></span><span id="health-text">verificando…</span></span>
          <span class="muted" id="origin"></span>
        </div>
        <div class="error" id="error" hidden></div>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <div class="sub">Código de pareamento</div>
            <div class="code" id="code">------</div>
            <div class="muted" id="code-expiry">nenhum código ativo</div>
          </div>
          <button class="primary" id="new-code">Gerar código</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <div class="name">Pedidos de conexão</div>
            <div class="muted">Autorize apenas o VSX que você está usando.</div>
          </div>
          <span class="muted" id="pending-count">0</span>
        </div>
        <ul id="requests"><li class="empty">nenhum pedido pendente</li></ul>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <div class="name">Como conectar o VSX</div>
            <div class="muted">
              No VSX, abra <strong>EduTerminal</strong>, informe o endereço
              <code id="connect-url"></code> e o código acima.
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let requestTimer = null;

      function showError(message) {
        const node = $("error");
        node.textContent = message || "";
        node.hidden = !message;
      }

      async function api(path, options) {
        const res = await fetch(path, {
          ...options,
          headers: { "content-type": "application/json", ...(options?.headers || {}) },
        });
        const text = await res.text();
        let payload = null;
        try { payload = text ? JSON.parse(text) : {}; } catch { payload = { error: text }; }
        if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
        return payload;
      }

      async function health() {
        try {
          const info = await api("/health");
          $("health-dot").className = "dot ok";
          $("health-text").textContent = `servidor ativo · v${info.version}`;
        } catch {
          $("health-dot").className = "dot err";
          $("health-text").textContent = "servidor indisponível";
        }
      }

      function renderCode(current) {
        if (current?.code) {
          $("code").textContent = current.code;
          const seconds = Math.max(0, Math.round((current.expiresAt - Date.now()) / 1000));
          $("code-expiry").textContent = `válido por ${seconds}s`;
        } else {
          $("code").textContent = "------";
          $("code-expiry").textContent = "nenhum código ativo";
        }
      }

      async function loadCode() {
        try {
          const current = await api("/api/eduterminal/pairing/current");
          renderCode(current);
        } catch (error) {
          showError(error.message);
        }
      }

      async function newCode() {
        showError("");
        try {
          const current = await api("/api/eduterminal/pairing/start", {
            method: "POST",
            body: JSON.stringify({ label: "VSX" }),
          });
          renderCode(current);
        } catch (error) {
          showError(error.message);
        }
      }

      function renderRequests(requests) {
        const list = $("requests");
        $("pending-count").textContent = String(requests.length);
        if (!requests.length) {
          list.innerHTML = '<li class="empty">nenhum pedido pendente</li>';
          return;
        }
        list.replaceChildren();
        for (const request of requests) {
          const item = document.createElement("li");
          const info = document.createElement("div");
          info.innerHTML =
            `<div class="name">${escapeHtml(request.name)}</div>` +
            `<div class="muted">${escapeHtml(request.ip || "dispositivo desconhecido")}</div>`;
          const actions = document.createElement("div");
          actions.className = "actions";

          const approve = document.createElement("button");
          approve.className = "primary";
          approve.textContent = "Autorizar";
          approve.onclick = () => decide(request.requestId, true);

          const deny = document.createElement("button");
          deny.className = "danger";
          deny.textContent = "Recusar";
          deny.onclick = () => decide(request.requestId, false);

          actions.append(approve, deny);
          item.append(info, actions);
          list.append(item);
        }
      }

      async function decide(requestId, approve) {
        showError("");
        try {
          await api(approve ? "/api/eduterminal/pair/approve" : "/api/eduterminal/pair/deny", {
            method: "POST",
            body: JSON.stringify({ requestId }),
          });
          await loadRequests();
        } catch (error) {
          showError(error.message);
        }
      }

      async function loadRequests() {
        try {
          const { requests } = await api("/api/eduterminal/requests");
          renderRequests(requests);
        } catch (error) {
          showError(error.message);
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[char]));
      }

      $("origin").textContent = location.origin;
      $("connect-url").textContent = location.origin;
      $("new-code").onclick = newCode;

      health();
      loadCode();
      loadRequests();
      requestTimer = setInterval(() => {
        loadCode();
        loadRequests();
      }, 2000);
      window.addEventListener("beforeunload", () => clearInterval(requestTimer));
    </script>
  </body>
</html>
